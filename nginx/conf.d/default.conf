# ==============================================================================
# Nginx Reverse Proxy Configuration - TinHoc Education Platform
# Chuẩn kiến trúc Production: SSL Termination, HTTP/2, WebSocket, Gzip
# ==============================================================================

# 1. Chuyển hướng toàn bộ traffic HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Hỗ trợ xác thực Let's Encrypt (khi triển khai Domain thực tế)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS chính (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost;

    # Cấu hình SSL Certificates
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Bảo mật giao thức SSL/TLS chuẩn OWASP
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Giới hạn kích thước tải lên (hỗ trợ upload tài liệu/bài tập tối đa 64MB)
    client_max_body_size 64M;

    # Tối ưu hóa nén dữ liệu Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Các Header chuyển tiếp danh tính Client cho Backend
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --------------------------------------------------------------------------
    # Route: Backend FastAPI (API Endpoints, Healthcheck & Docs)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # --------------------------------------------------------------------------
    # Route: Frontend Vue 3 + Vite (Hỗ trợ WebSocket / HMR)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

